[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kakaotalk-reader"
version = "0.1.0"
description = "CLI tool to read KakaoTalk Mac's encrypted local database"
requires-python = ">=3.10"
license = "MIT"

[project.scripts]
kakaotalk-reader = "kakaotalk_reader:main"

[tool.setuptools]
py-modules = ["kakaotalk_reader"]

[tool.setuptools.package-dir]
"" = "src"
